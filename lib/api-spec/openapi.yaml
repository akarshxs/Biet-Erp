              schema:
                $ref: "#/components/schemas/MessageResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ManagedRecord:
      type: object
      required: [id]
      properties:
        id:
          type: string
      additionalProperties: true

    ManagedRecordInput:
      type: object
      additionalProperties: true

    # ── Auth ──────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
        phone:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        semester:
          type: ["integer", "null"]

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    UpdateProfileInput:
      type: object
      properties:
        name:
          type: string
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        profileImage:
          type: ["string", "null"]

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # ── User ──────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, email, name, role, isActive, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        semester:
          type: ["integer", "null"]
        profileImage:
          type: ["string", "null"]
        employeeId:
          type: ["string", "null"]
        rollNumber:
          type: ["string", "null"]
        admissionYear:
          type: ["integer", "null"]
        batch:
          type: ["string", "null"]
        designation:
          type: ["string", "null"]
        qualification:
          type: ["string", "null"]
        experience:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    UserInput:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
        phone:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        semester:
          type: ["integer", "null"]
        employeeId:
          type: ["string", "null"]
        rollNumber:
          type: ["string", "null"]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        semester:
          type: ["integer", "null"]
        role:
          type: string
        isActive:
          type: boolean
        designation:
          type: ["string", "null"]
        qualification:
          type: ["string", "null"]

    # ── Department ────────────────────────────────────────────────────────
    Department:
      type: object
      required: [id, name, code, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        head:
          type: ["string", "null"]
        studentCount:
          type: ["integer", "null"]
        teacherCount:
          type: ["integer", "null"]
        createdAt:
          type: string

    DepartmentInput:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
        code:
          type: string
        head:
          type: ["string", "null"]

    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        head:
          type: ["string", "null"]

    # ── Subject ───────────────────────────────────────────────────────────
    Subject:
      type: object
      required: [id, code, name, department, semester, credits, createdAt]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        department:
          type: string
        semester:
          type: integer
        credits:
          type: integer
        teacherId:
          type: ["string", "null"]
        teacherName:
          type: ["string", "null"]
        createdAt:
          type: string

    SubjectInput:
      type: object
      required: [code, name, department, semester, credits]
      properties:
        code:
          type: string
        name:
          type: string
        department:
          type: string
        semester:
          type: integer
        credits:
          type: integer
        teacherId:
          type: ["string", "null"]

    SubjectUpdate:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        department:
          type: string
        semester:
          type: integer
        credits:
          type: integer
        teacherId:
          type: ["string", "null"]

    # ── Attendance ────────────────────────────────────────────────────────
    AttendanceRecord:
      type: object
      required: [id, studentId, subjectId, date, status, createdAt]
      properties:
        id:
          type: string
        studentId:
          type: string
        studentName:
          type: ["string", "null"]
        subjectId:
          type: string
        subjectName:
          type: ["string", "null"]
        date:
          type: string
        status:
          type: string
        markedBy:
          type: string
        createdAt:
          type: string

    AttendanceInput:
      type: object
      required: [subjectId, date, records]
      properties:
        subjectId:
          type: string
        date:
          type: string
        records:
          type: array
          items:
            type: object
            required: [studentId, status]
            properties:
              studentId:
                type: string
              status:
                type: string

    AttendanceStats:
      type: object
      required: [bySubject, overall]
      properties:
        bySubject:
          type: array
          items:
            type: object
            properties:
              subjectId:
                type: string
              subjectName:
                type: string
              present:
                type: integer
              total:
                type: integer
              percentage:
                type: number
        overall:
          type: object
          properties:
            present:
              type: integer
            total:
              type: integer
            percentage:
              type: number

    # ── Assignment ────────────────────────────────────────────────────────
    Assignment:
      type: object
      required: [id, title, description, department, semester, dueDate, maxMarks, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        subjectId:
          type: ["string", "null"]
        subjectName:
          type: ["string", "null"]
        teacherId:
          type: ["string", "null"]
        teacherName:
          type: ["string", "null"]
        department:
          type: string
        semester:
          type: integer
        dueDate:
          type: string
        maxMarks:
          type: integer
        submissionCount:
          type: ["integer", "null"]
        mySubmission:
          $ref: "#/components/schemas/Submission"
        createdAt:
          type: string

    AssignmentInput:
      type: object
      required: [title, description, department, semester, dueDate, maxMarks]
      properties:
        title:
          type: string
        description:
          type: string
        subjectId:
          type: ["string", "null"]
        department:
          type: string
        semester:
          type: integer
        dueDate:
          type: string
        maxMarks:
          type: integer

    AssignmentUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        dueDate:
          type: string
        maxMarks:
          type: integer

    # ── Submission ────────────────────────────────────────────────────────
    Submission:
      type: object
      required: [id, assignmentId, studentId, status, submittedAt]
      properties:
        id:
          type: string
        assignmentId:
          type: string
        studentId:
          type: string
        studentName:
          type: ["string", "null"]
        marks:
          type: ["integer", "null"]
        feedback:
          type: ["string", "null"]
        status:
          type: string
        submittedAt:
          type: string

    SubmissionInput:
      type: object
      required: [assignmentId]
      properties:
        assignmentId:
          type: string

    EvaluateInput:
      type: object
      required: [marks]
      properties:
        marks:
          type: integer
        feedback:
          type: ["string", "null"]

    # ── Result ────────────────────────────────────────────────────────────
    Result:
      type: object
      required: [id, studentId, subjectId, internalMarks, externalMarks, totalMarks, grade, semester, academicYear, createdAt]
      properties:
        id:
          type: string
        studentId:
          type: string
        studentName:
          type: ["string", "null"]
        subjectId:
          type: string
        subjectName:
          type: ["string", "null"]
        internalMarks:
          type: number
        externalMarks:
          type: number
        totalMarks:
          type: number
        grade:
          type: string
        semester:
          type: integer
        academicYear:
          type: string
        createdAt:
          type: string

    ResultInput:
      type: object
      required: [studentId, subjectId, internalMarks, externalMarks, semester, academicYear]
      properties:
        studentId:
          type: string
        subjectId:
          type: string
        internalMarks:
          type: number
        externalMarks:
          type: number
        semester:
          type: integer
        academicYear:
          type: string

    ResultUpdate:
      type: object
      properties:
        internalMarks:
          type: number
        externalMarks:
          type: number

    SgpaData:
      type: object
      required: [sgpaList, cgpa, totalSemesters]
      properties:
        sgpaList:
          type: array
          items:
            type: object
            properties:
              semester:
                type: integer
              sgpa:
                type: number
        cgpa:
          type: number
        totalSemesters:
          type: integer

    # ── Fee ───────────────────────────────────────────────────────────────
    Fee:
      type: object
      required: [id, studentId, feeType, amount, paidAmount, dueDate, status, academicYear, createdAt]
      properties:
        id:
          type: string
        studentId:
          type: string
        studentName:
          type: ["string", "null"]
        feeType:
          type: string
        amount:
          type: number
        paidAmount:
          type: number
        dueDate:
          type: string
        status:
          type: string
        academicYear:
          type: string
        createdAt:
          type: string

    FeeInput:
      type: object
      required: [studentId, feeType, amount, dueDate]
      properties:
        studentId:
          type: string
        feeType:
          type: string
        amount:
          type: number
        paidAmount:
          type: ["number", "null"]
        dueDate:
          type: string
        academicYear:
          type: ["string", "null"]

    PayFeeInput:
      type: object
      required: [feeId, amount]
      properties:
        feeId:
          type: string
        amount:
          type: number
        paymentMethod:
          type: ["string", "null"]

    # ── Notice ────────────────────────────────────────────────────────────
    Notice:
      type: object
      required: [id, title, content, authorId, authorName, priority, isActive, createdAt]
      properties:
        id:
          type: string
