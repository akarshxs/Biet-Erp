          type: string
        targetValue:
          type: ["string", "null"]
        priority:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string

    NoticeInput:
      type: object
      required: [title, content, priority]
      properties:
        title:
          type: string
        content:
          type: string
        department:
          type: ["string", "null"]
        target:
          type: string
        targetValue:
          type: ["string", "null"]
        priority:
          type: string

    NoticeUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        priority:
          type: string
        isActive:
          type: boolean

    # ── Event ─────────────────────────────────────────────────────────────
    Event:
      type: object
      required: [id, title, description, type, date, venue, organizer, maxParticipants, registrations, createdAt]
      properties:
        id:
